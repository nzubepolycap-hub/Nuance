name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any code change — a dependency can grow a new
    # published CVE without this repo touching a single line, and neither
    # pip-audit nor npm audit would ever run again to notice that on a
    # push-only trigger.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
        working-directory: backend
        continue-on-error: true

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --audit-level=high, not the npm default (any severity fails the
      # build): a low/moderate finding in a devDependency (build tooling
      # that never ships to a browser) isn't worth blocking every PR over
      # — high/critical is the bar that's actually worth a red build.
      - run: npm audit --audit-level=high
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
